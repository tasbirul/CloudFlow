name: CloudFlow CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v2

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Build, tag, and push Docker image
      - name: Build and Push Docker Image
        run: |
          IMAGE_URI=${{ steps.ecr_login.outputs.registry }}/noderepo
          echo "Building image..."
          docker build -t $IMAGE_URI:$GITHUB_SHA .
          docker tag $IMAGE_URI:$GITHUB_SHA $IMAGE_URI:latest
          echo "Pushing images to ECR..."
          docker push $IMAGE_URI:$GITHUB_SHA
          docker push $IMAGE_URI:latest

      # 5. Deploy to EC2 using SSH + docker-compose
      - name: Deploy on EC2
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOSTNAME: ${{ secrets.HOSTNAME }}
          USER_NAME: ${{ secrets.USERNAME }}
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Save private key
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # Replace placeholders in docker-compose.yml
          sed -i -e 's|ECR_REGISTRY|'$ECR_REGISTRY'|' ${{ github.workspace }}/docker-compose.yml
          sed -i -e 's|GITHUB_SHA|'$GITHUB_SHA'|' ${{ github.workspace }}/docker-compose.yml
          
          # Copy docker-compose.yml to EC2
          scp -o StrictHostKeyChecking=no -i private_key.pem ${{ github.workspace }}/docker-compose.yml ${USER_NAME}@${HOSTNAME}:/tmp
          
          # SSH and run container using Docker Compose (use EOF without quotes to allow variable expansion)
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER_NAME}@${HOSTNAME} << EOF
            cd /tmp
            
            # Export AWS credentials for ECR authentication
            export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"
            export AWS_DEFAULT_REGION="${AWS_REGION}"
            
            # Login to ECR from EC2
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
            
            # Pull latest images
            docker compose pull || docker-compose pull
            
            # Stop and remove old containers
            docker compose --project-name nodejs-app down || docker-compose --project-name nodejs-app down || true
            
            # Deploy with docker compose
            docker compose --project-name nodejs-app up -d || docker-compose --project-name nodejs-app up -d
            
            # Verify deployment
            docker compose --project-name nodejs-app ps || docker-compose --project-name nodejs-app ps
            
            # Clean up old images to save space
            docker image prune -af --filter "until=24h" || true
          EOF
          
          # Clean up private key
          rm -f private_key.pem